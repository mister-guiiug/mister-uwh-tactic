<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Mister UWH Tactic">
  <!--
    LA MARQUE : une crosse de hockey subaquatique, la lame à plat sur le
    fond, lève le palet ; il part en flick, la parabole que l'outil « Flick »
    trace sur le tableau. La surface est en haut, le palet est rose comme sur
    le terrain. Ce fichier fait le favicon, et `npm run icons` en tire les
    PNG du manifeste plus l'icône maskable.

    LA TUILE ET LE FOND DU MASKABLE VONT PAR PAIRE. Le maskable est fabriqué
    en réduisant cette image puis en comblant le pourtour d'une couleur unie :
    l'option « bg » du script `icons` de `package.json`. Elle doit valoir la
    teinte EXACTE du rectangle ci-dessous : 11,107,133 pour #0b6b85, la
    primaire de la palette « bassin ». La tuile reste unie, sans dégradé.

    (L'option ne s'écrit pas ici avec ses deux tirets : XML interdit le double
    tiret dans un commentaire, et le rasteriseur refuserait le fichier.)
  -->
  <rect width="64" height="64" rx="14" fill="#0b6b85" />
  <path d="M10 14q3 -3.4 6 0t6 0t6 0t6 0t6 0t6 0t6 0" fill="none" stroke="#5cc4e0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M29.5 40C33 25.5 46.5 25.5 51 38.6" fill="none" stroke="#f8fafc" stroke-width="3.3" stroke-linecap="round" stroke-dasharray="4.4 3.8" />
  <path d="M47.2 37.6L51.9 41.1L54.2 35.7" fill="none" stroke="#f8fafc" stroke-width="3.3" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M8.5 32.5L13.6 46.4Q14.4 48.8 17 48.8L18 48.8" fill="none" stroke="#f8fafc" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M18.6 45.6v2.6a7.3 3.1 0 0 0 14.6 0v-2.6a7.3 3.1 0 0 1 -14.6 0z" fill="#db2777" />
  <ellipse cx="25.9" cy="45.6" rx="7.3" ry="3.1" fill="#fbcfe8" />
</svg>
