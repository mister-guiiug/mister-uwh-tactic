<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Mister UWH Tactic">
  <!--
    LA MARQUE, EN ONGLET : le tableau tactique de `public/icons/icon.svg`
    (un joueur, le palet, le flick par-dessus le défenseur), redessiné pour
    16 et 32 px. L'anneau pâle disparaît, les traits s'épaississent, les
    éléments grossissent, et la parabole devient pleine : en pointillés, elle
    s'émiette en points sous 48 px. La tuile garde ses coins arrondis,
    puisque aucun système ne découpe un favicon.

    Ce fichier ne fait QUE le favicon : les icônes de l'application sortent
    de `public/icons/icon.svg` par `npm run icons`. Un changement de la
    marque se fait dans les deux.
  -->
  <defs>
    <radialGradient id="bg" cx="32" cy="32" r="32" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#21729a" />
      <stop offset=".62" stop-color="#144b71" />
      <stop offset="1" stop-color="#0c2c48" />
    </radialGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)" />
  <path d="M37.5 30.5l7 7M44.5 30.5l-7 7" fill="none" stroke="#9fd6ec" stroke-width="4" stroke-linecap="round" />
  <g fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="13" cy="27" r="6" />
    <path d="M29 36Q40 2 54 36" />
    <path d="M48.9 32L54 36L54.9 29.6" />
  </g>
  <g stroke="#0a1a2b" stroke-width="2" stroke-linejoin="round">
    <path d="M12 41v5a9 3.4 0 0 0 18 0v-5z" fill="#e0521b" />
    <ellipse cx="21" cy="41" rx="9" ry="3.4" fill="#ff8040" />
  </g>
</svg>
